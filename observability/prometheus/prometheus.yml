global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Application + spanmetrics, pushed via OTLP to the collector and exposed on :8889.
  # honor_labels keeps job=<service.name> / instance=<service.instance.id> set by the collector.
  - job_name: otel-collector-exporter
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

asyncapi: 2.6.0
id: urn:io:otelsandbox:warehouse
info:
  title: Warehouse Events
  version: 1.0.0
  description: |
    External Warehouse system publishing the available stock of each product on Kafka.
    Mocked by Microcks: every `frequency` seconds (3, 10 or 30) the async minion publishes each example
    on the topic `WarehouseEvents-1.0.0-stock-levels`.
defaultContentType: application/json
channels:
  stock-levels:
    subscribe:
      operationId: receiveStockLevelChanged
      summary: The available stock of a product changed
      x-microcks-operation:
        frequency: 3   # the minion schedules 3, 10 or 30 s ticks
      bindings:
        kafka:
          bindingVersion: 0.4.0
      message:
        $ref: "#/components/messages/StockLevelChanged"
components:
  messages:
    StockLevelChanged:
      name: StockLevelChanged
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StockLevelChanged"
      examples:
        - name: SKU-001 plenty
          payload:
            sku: SKU-001
            available: 500
            warehouse: WH-PARIS
            occurredAt: "{{now(yyyy-MM-dd'T'HH:mm:ss'Z')}}"
        - name: SKU-002 sold out
          payload:
            sku: SKU-002
            available: 0
            warehouse: WH-PARIS
            occurredAt: "{{now(yyyy-MM-dd'T'HH:mm:ss'Z')}}"
        - name: SKU-003 scarce
          payload:
            sku: SKU-003
            available: 3
            warehouse: WH-LYON
            occurredAt: "{{now(yyyy-MM-dd'T'HH:mm:ss'Z')}}"
  schemas:
    StockLevelChanged:
      type: object
      required: [sku, available, warehouse, occurredAt]
      properties:
        sku:
          type: string
        available:
          type: integer
          minimum: 0
        warehouse:
          type: string
        occurredAt:
          type: string
          format: date-time

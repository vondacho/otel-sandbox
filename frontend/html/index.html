<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTEL Sandbox Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>OTEL Sandbox Shop</h1>
    <nav>
      <a href="http://localhost:3000" target="_blank" rel="noopener">Grafana</a>
      <a href="http://localhost:16686" target="_blank" rel="noopener">Jaeger</a>
      <a href="http://localhost:9090" target="_blank" rel="noopener">Prometheus</a>
      <a href="http://localhost:8585" target="_blank" rel="noopener">Microcks</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Place an order</h2>
      <form id="order-form">
        <label>SKU
          <select name="sku">
            <option>SKU-001</option>
            <option>SKU-002</option>
            <option>SKU-003</option>
            <option>SKU-999</option>
          </select>
        </label>
        <label>Quantity <input name="quantity" type="number" min="1" max="100" value="1"></label>
        <button type="submit">Order</button>
      </form>
      <p id="result" role="status"></p>
    </section>

    <section>
      <h2>Stock <small>(from Warehouse events on Kafka)</small></h2>
      <table>
        <thead><tr><th>SKU</th><th>Available</th><th>Warehouse</th><th>Updated</th></tr></thead>
        <tbody id="stock"></tbody>
      </table>
    </section>

    <section>
      <h2>Latest orders</h2>
      <table>
        <thead><tr><th>Created</th><th>SKU</th><th>Qty</th><th>Total</th><th>Status</th></tr></thead>
        <tbody id="orders"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

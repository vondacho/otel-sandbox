load_module modules/ngx_otel_module.so;

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # Server spans for every proxied request, exported over OTLP/gRPC to the collector
    otel_exporter {
        endpoint otel-collector:4317;
    }
    otel_service_name frontend;
    otel_resource_attr deployment.environment.name sandbox;
    otel_trace on;

    server {
        listen 80;

        location / {
            otel_trace off;
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            # join the caller's trace (if any) and pass traceparent on to the order-service
            otel_trace_context propagate;
            otel_span_name "$request_method /api";
            proxy_pass http://order-service:8080;
            proxy_set_header Host $host;
        }
    }
}
